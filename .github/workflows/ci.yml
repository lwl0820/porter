name: Verify

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/.tmp/tmp
      GOTMPDIR: ${{ github.workspace }}/.tmp/tmp
      GOCACHE: ${{ github.workspace }}/.tmp/go-cache
      GOPATH: ${{ github.workspace }}/.tmp/go-path
      GOMODCACHE: ${{ github.workspace }}/.tmp/go-mod
      npm_config_cache: ${{ github.workspace }}/.tmp/npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create workspace directories
        run: mkdir -p "$TMPDIR" "$GOCACHE" "$GOPATH" "$GOMODCACHE" "$npm_config_cache"
      - name: 检查原生交互安装器
        run: |
          bash -n scripts/install.sh
          bash scripts/install.sh --help
          python3 scripts/test-install.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - name: Check and build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web run type-check
          npm --prefix web run test
          npm --prefix web run build
      - name: Run Go static analysis, race tests, and network integration tests
        run: |
          python3 scripts/check-build-boundaries.py
          go vet ./...
          go test -race ./...
          go test -tags porter_docker ./...
          go test -count=1 ./tests/integration/...
      - name: Build and verify both native programs
        run: |
          for program in porter porterd; do
            CGO_ENABLED=0 go build -trimpath -ldflags '-X main.version=ci' -o ".tmp/$program" "./cmd/$program"
            test "$(".tmp/$program" --version)" = ci
          done
      - name: Validate required Compose password
        run: |
          PORTER_ADMIN_PASSWORD=validation-only docker compose config --quiet
          if PORTER_ADMIN_PASSWORD= docker compose config --quiet 2>/dev/null; then
            echo 'An empty password must fail Compose validation' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image and verify container
        run: |
          docker build --build-arg VERSION=ci -t porter:ci .
          python3 scripts/docker-smoke.py porter:ci
